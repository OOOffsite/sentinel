name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional check dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt
      - name: Module fixtures
        run: python tests/test_module.py
      - name: Build and check documentation
        run: python tools/build_site.py --check
      - name: Check site JavaScript
        run: |
          node --check site/assets/site.js
          node --check site/assets/product-preview.js
          node --check site/assets/product-preview-data.js
