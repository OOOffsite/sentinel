name: Prepare or publish Python release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build only unless publication is explicitly selected
        type: choice
        options: [build-only, testpypi, pypi]
        default: build-only
        required: true
      version:
        description: Exact package version to validate
        type: string
        default: '0.4.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate selected version and publication ref
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert os.environ['RELEASE_VERSION'] == project['version'], 'Selected version differs from package'
          if os.environ['RELEASE_TARGET'] != 'build-only':
              assert os.environ['GITHUB_REPOSITORY'].lower() == 'oooffsite/sentinel', 'Wrong release repository'
              assert os.environ['GITHUB_REF'] == 'refs/tags/v' + project['version'], 'Publish only from the matching reviewed version tag'
          PY
      - name: Install build and fixture tools in the disposable runner
        run: python -m pip install -r requirements-release.txt -r requirements-dev.txt
      - name: Run module fixtures
        run: python tests/test_module.py
      - name: Build source distribution and wheel
        run: python -m build --outdir release-dist
      - name: Check package metadata and rendered description
        run: python -m twine check --strict release-dist/*
      - name: Verify artifact contents and packaged CLI
        run: python tools/check_release.py release-dist --require-publishable
      - name: Retain the checked artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: release-dist/*
          if-no-files-found: error
          retention-days: 14

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-dist
      - name: Install only the checked wheel
        run: |
          python -m pip install --no-index --no-deps release-dist/*.whl
          python -m pip check
          sentinel-openrig --help
          sentinel-project --help
      - name: Run fixtures against the installed package
        run: |
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, tempfile
          source = Path('tests/test_module.py').read_text()
          old = "sys.path.insert(0,str(pathlib.Path(__file__).resolve().parents[1]/'tools'));import sentinel as s"
          assert old in source, 'Fixture import changed; review installed-package test adapter'
          source = source.replace(old, 'from atlas_sentinel.tools import sentinel as s')
          with tempfile.TemporaryDirectory() as directory:
              test = Path(directory) / 'test_installed_module.py'
              test.write_text(source)
              subprocess.run([sys.executable, str(test)], cwd=directory, check=True)
          PY

  publish:
    if: inputs.target != 'build-only'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - name: Download the artifacts checked by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-dist
      - name: Publish to TestPyPI via its configured Trusted Publisher
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-dist/
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI via its configured Trusted Publisher
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-dist/
